schema_version: 3
collection_mode: standard

server:
  host: 0.0.0.0
  port: 8080
  cors_origins: []

storage:
  root: var/maas-observatory
  database: observatory.sqlite3
  writer_queue_size: 2048
  probe_retention_days: 365
  daily_backups: 7
  weekly_backups: 4

probes:
  route_interval_seconds: 60
  confirmation_delay_seconds: 60
  response_start_timeout_seconds: 180
  stream_stall_seconds: 30
  canary_max_output_tokens: 8
  short_max_output_tokens: 1024
  context_max_output_tokens: 1024
  rapid_block_interval_seconds: 60
  standard_block_interval_seconds: 360
  standard_budget:
    response_requests: 240
    output_tokens: 245760

profiles:
  deepseek-v4-pro: thinking
  deepseek-v4-flash: thinking
  glm-5.2: no-thinking
  qwen3.6-27b: no-thinking
  kimi-k2.6: no-thinking
  minimax-m2.7: default-only
  mimo-v2.5-pro: default-only
  nex-n2-pro-w8a8: default-only
  nex-n2-pro-bf16: thinking

experience:
  vantage_id: observatory-primary
  suite_version: response-suite-v4
  response_profile_id: response-v4
  definition_version: "4"
  summary_min_samples: 6
  baseline_min_samples: 20
