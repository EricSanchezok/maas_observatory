schema_version: 1
experiment_id: release-v1
description: First public MaaS tool-use evaluation.
models: ["*"]
lanes: [standardized, official-reproduction]
output_root: runs
benchmarks:
  - benchmark_id: probe
    profile: full
    trials: 3
    options:
      transport_timeout_seconds: 90
      transport_wall_timeout_seconds: 60
      transport_max_retries: 0
      max_tokens: 4096
  - benchmark_id: bfcl-v4
    profile: full-public
    trials: 1
    options:
      backend: evalscope
      batch_size: 25
      sdk_max_retries: 0
      request_timeout_seconds: 90
      transport_circuit_breaker_min_samples: 50
      transport_circuit_breaker_error_fraction: 0.95
      temperature: 0
      timeout_seconds: 43200
  - benchmark_id: toolathlon-verified
    profile: official
    trials: 3
    options:
      backend: self-hosted
      workers: 10
      timeout_seconds: 21600
      server_revision: 2aed2468858f15818acafa178518390cc4b0f5cb
      task_image: docker.io/lockon0927/toolathlon-task-image@sha256:4d04fe4e0a6fdb4946f51bb05120cb44a0eef980231c11252f93b62897afcb9f
