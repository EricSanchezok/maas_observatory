schema_version: 1

defaults:
  timeout_seconds: 600

deployments:
  - deployment_id: maas-deepseek-v4-pro-w4a8
    alias: deepseek-v4-pro
    name: DeepSeek V4 Pro (W4A8)
    provider: Academy MaaS
    family: deepseek-v4
    upstream_model: DeepSeek-V4-Pro
    upstream_source: https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro
    model_id: ds-v4-pro
    precision: W4A8
    context_limit: 1000000
    output_limit: 393216
    input_modalities: [text]
    endpoint:
      base_url_env: SII_HOLOS_DEEPSEEK_V4_PRO_BASE_URL
      api_key_env: SII_HOLOS_DEEPSEEK_V4_PRO_API_KEY
    capabilities:
      reasoning: true
      temperature: true
      tool_call_declared: true
    serving:
      engine: unknown
      chat_template: dedicated DeepSeek V4 encoding
      reasoning_parser: unknown
      tool_call_parser: unknown
    profiles:
      thinking:
        request_overrides:
          chat_template_kwargs:
            thinking: true

