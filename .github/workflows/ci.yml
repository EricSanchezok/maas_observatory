name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Synchronize locked environment
        run: uv sync --extra dev --extra docs --frozen
      - name: Check formatting and lint
        run: |
          uv run ruff format --check src tests scripts
          uv run ruff check src tests scripts
      - name: Check types
        run: uv run mypy src
      - name: Check schemas
        run: uv run python scripts/check_schemas.py
      - name: Scan public files for secrets
        run: uv run python scripts/scan_secrets.py
      - name: Run tests and enforce coverage
        run: >
          uv run pytest --cov=tooluse_bench
          --cov-report=term-missing --cov-report=xml
      - name: Build Python distributions
        run: uv build
      - name: Build documentation
        run: uv run mkdocs build --strict
